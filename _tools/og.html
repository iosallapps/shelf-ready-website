<!DOCTYPE html>
<!-- Source for og-image.png: serve the site root on port 8731, then shoot this page at 1200x630. -->
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--paper)}
.og{width:1200px;height:630px;display:grid;grid-template-columns:1fr 430px;gap:48px;align-items:center;padding:0 64px 0 80px;box-sizing:border-box}
.brand{font-size:34px;gap:14px}
.brand img{width:52px;height:52px;border-radius:12px}
h1{font-size:76px;white-space:nowrap;line-height:1;letter-spacing:-.03em;margin:40px 0 0;font-variation-settings:"opsz" 72}
.art{position:relative;width:430px;height:538px;border-radius:20px;overflow:hidden}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art .after{clip-path:inset(0 0 0 31%)}
.art i{position:absolute;top:0;bottom:0;left:31%;width:2px;margin-left:-1px;background:#fff}
</style></head><body>
<div class="og">
  <div>
    <div class="brand"><img src="../img/app-icon-128.png" alt=""><span>ShelfReady</span></div>
    <h1>Take the photo.<br>Skip the studio.</h1>
  </div>
  <div class="art"><img src="../img/hero-before-768.jpg" alt=""><img class="after" src="../img/hero-after-768.jpg" alt=""><i></i></div>
</div>
</body></html>
